<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Turn a PDF into a smooth, speed-adjustable teleprompter. Runs entirely in your browser — nothing is uploaded."
    />
    <meta name="theme-color" content="#050506" />
    <title>PDF Teleprompter</title>
    <script>
      // Applies the saved theme before first paint so there is no flash of the
      // wrong background. Mirrors the zustand persist key in the store.
      try {
        var saved = localStorage.getItem('pdf-teleprompter-settings')
        var theme = saved ? JSON.parse(saved).state.theme : 'dark'
        document.documentElement.classList.toggle('dark', theme !== 'light')
      } catch (error) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
